<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Привязка канала · ZylosBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@480;620&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="landing">
    <span class="badge">почти готово</span>
    <h1>Какой у тебя Twitch-канал?</h1>
    <p>Google не знает про Twitch, так что укажи название канала сам. Это не проверяется автоматически — админ бота увидит это в списке каналов.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<p style="color:var(--coral)">{{ messages[0] }}</p>{% endif %}
    {% endwith %}
    <form method="post" style="display:flex; gap:10px; width:320px;">
      <input type="text" name="twitch_login" placeholder="имя_канала" class="mono"
        style="flex:1; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--paper); padding:11px 14px;">
      <button type="submit" class="btn btn-primary">Продолжить</button>
    </form>
  </div>
</body>
</html>
